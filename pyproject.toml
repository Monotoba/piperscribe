[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piperscribe"
version = "0.1.26"
license = "LicenseRef-PiperScribe-PAL-1.0"
license-files = ["LICENSE"]
description = "PySide6 GUI to import documents, mark exclusions, and generate audio with Piper."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
]

[project.optional-dependencies]
importers = [
  "python-docx>=1.1.0",
  "PyMuPDF>=1.24.0",
  "beautifulsoup4>=4.12.0",
  "markdown-it-py>=3.0.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.8",
]

[project.scripts]
piperscribe = "piperscribe.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Explicit rules so CI and local checks agree across ruff versions.
select = ["E", "W", "F", "I", "B", "RUF"]
# E501 (line length) is left off: long lines are a style choice, not a defect.
# RUF001 is left off: the UI uses × and ⨯ on purpose as icons.
ignore = ["E501", "RUF001"]
